<div id="panes">
  <div id="app" class="pane" tabindex="0"></div>
  <div id="side-wrap" hidden>
    <nav id="layers"></nav>
    <div id="side" class="pane" tabindex="0"></div>
  </div>
  <aside id="ast" hidden></aside>
  <aside id="stops" hidden></aside>
  <aside id="clients" hidden></aside>
  <aside id="repo" hidden></aside>
  <aside id="ai" hidden>
    <div class="head">ИИ — ваш Claude Code · правки — предложениями</div>
    <div class="log"></div>
    <form id="ai-form">
      <button id="ai-context" type="button" hidden></button>
      <textarea
        id="ai-input"
        rows="3"
        placeholder="спросите или попросите правку… (Ctrl+Enter)"
      ></textarea>
      <button type="submit">Отправить</button>
    </form>
  </aside>
</div>
<section id="run" hidden>
  <div id="run-head"></div>
  <div class="run-inputs">
    <textarea id="run-stdin" rows="2" placeholder="stdin программы"></textarea>
    <input id="run-args" placeholder="аргументы" />
  </div>
  <pre id="run-output"></pre>
</section>
<section id="merge" hidden></section>
<section id="proposals" hidden></section>
<div id="trace-bar" hidden></div>
<form id="goto" hidden>
  <div id="goto-card">
    <input
      id="goto-input"
      spellcheck="false"
      placeholder="перейти или добавить: foo(i64)"
    />
    <div id="goto-body"></div>
  </div>
</form>
<div id="status" kind="vm">
  <span id="status-text">подключение к VM…</span><span id="status-hint"></span
  ><button id="status-action" hidden></button>
</div>

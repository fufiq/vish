<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>царьяз</title>
  </head>
  <body>
    <div id="panes">
      <div id="app" class="pane" tabindex="0"></div>
      <div id="side-wrap" hidden>
        <nav id="layers"></nav>
        <div id="side" class="pane" tabindex="0"></div>
      </div>
    </div>
    <section id="run" hidden>
      <div class="run-inputs">
        <textarea
          id="run-stdin"
          rows="2"
          placeholder="stdin программы"
        ></textarea>
        <input id="run-args" placeholder="аргументы" />
      </div>
      <pre id="run-output"></pre>
    </section>
    <form id="goto" hidden>
      <input id="goto-input" placeholder="перейти или добавить: foo(i64)" />
    </form>
    <div id="status">подключение к VM…</div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
